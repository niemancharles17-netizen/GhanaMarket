 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GhanaMarket</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #008000;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    margin: 0;
}

.cart {
    margin-top: 10px;
    font-size: 18px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.search {
    width: 100%;
    padding: 15px;
    box-sizing: border-box;
    font-size: 16px;
    margin-bottom: 25px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.product img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 8px;
}

.product h2 {
    font-size: 20px;
}

.price {
    color: #008000;
    font-size: 20px;
    font-weight: bold;
}

button {
    padding: 12px 18px;
    margin: 5px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #008000;
    color: white;
    font-size: 15px;
}

button.buy {
    background: #ff9800;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 20px;
    margin-top: 30px;
}
</style>
</head>

<body>

<header>
    <h1>🇬🇭 GhanaMarket</h1>
    <p>Buy and sell products in Ghana</p>

    <div class="cart">
        🛒 Cart: <span id="cartCount">0</span>
    </div>
</header>

<div class="container">

<input
    type="text"
    id="search"
    class="search"
    placeholder="🔎 Search for products..."
    onkeyup="searchProducts()"
>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80">
<h2>Samsung Galaxy Phone</h2>
<p class="price">GH₵3,500</p>

<button onclick="viewProduct('Samsung Galaxy Phone','GH₵3,500')">
View Product
</button>

<button class="buy" onclick="addToCart()">
Add to Cart
</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80">
<h2>Nike Sneakers</h2>
<p class="price">GH₵850</p>

<button onclick="viewProduct('Nike Sneakers','GH₵850')">
View Product
</button>

<button class="buy" onclick="addToCart()">
Add to Cart
</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=80">
<h2>HP Laptop</h2>
<p class="price">GH₵5,200</p>

<button onclick="viewProduct('HP Laptop','GH₵5,200')">
View Product
</button>

<button class="buy" onclick="addToCart()">
Add to Cart
</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80">
<h2>Wireless Headphones</h2>
<p class="price">GH₵450</p>

<button onclick="viewProduct('Wireless Headphones','GH₵450')">
View Product
</button>

<button class="buy" onclick="addToCart()">
Add to Cart
</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80">
<h2>Smart Watch</h2>
<p class="price">GH₵650</p>

<button onclick="viewProduct('Smart Watch','GH₵650')">
View Product
</button>

<button class="buy" onclick="addToCart()">
Add to Cart
</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?auto=format&fit=crop&w=800&q=80">
<h2>Digital Camera</h2>
<p class="price">GH₵4,800</p>

<button onclick="viewProduct('Digital Camera','GH₵4,800')">
View Product
</button>

<button class="buy" onclick="addToCart()">
Add to Cart
</button>
</div>

</div>
</div>

<footer>
<p>© 2026 GhanaMarket</p>
<p>Buy • Sell • Shop in Ghana 🇬🇭</p>
</footer>

<script>

let cartCount = 0;

function addToCart() {
    cartCount++;
    document.getElementById("cartCount").innerText=cartCount;

alert("Product added to your cart!");
}

function viewProduct(name, price) {
    alert(name + " - " + price);
}

</script>
</body>
</html>
