<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GhanaMarket</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: green;
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        input {
            width: 80%;
            max-width: 500px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid gray;
            font-size: 16px;
            margin: 20px 0;
        }

        .products {
            max-width: 600px;
            margin: auto;
        }

        .product {
            background: white;
            margin: 15px 0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product h2 {
            color: #222;
            margin: 0 0 10px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: green;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        footer {
            margin-top: 40px;
            color: #777;
        }
    </style>
</head>

<body>

    <h1>🇬🇭 GhanaMarket</h1>

    <p>Buy and sell products in Ghana</p>

    <input type="text" placeholder="Search for products...">

    <div class="products">

        <div class="product">
            <h2>Samsung Galaxy Phone</h2>
            <p class="price">₵3,500</p>
            <button onclick="alert('Samsung Galaxy Phone - GH₵3,500')">View Product</button>
        </div>

        <div class="product">
            <h2>Nike Sneakers</h2>
            <p class="price">₵850</p>
            <button>View Product</button>
        </div>

        <div class="product">
            <h2>HP Laptop</h2>
            <p class="price">₵5,200</p>
            <button>View Product</button>
        </div>

    </div>

    <footer>
        <p>© 2026 GhanaMarket</p>
    </footer>

</body>

</html>
