<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GH GhanaMarket</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
}

header {
    background: #168a45;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 40px;
}

header p {
    margin: 8px 0 0;
    font-size: 18px;
}

.cart {
    margin-top: 15px;
    font-size: 18px;
    font-weight: bold;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px;
}

.search {
    width: 100%;
    padding: 16px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 17px;
    margin-bottom: 25px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.product {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    text-align: center;
    padding-bottom: 20px;
}

.product img {
    width: 100%;
    height: 230px;
    object-fit: cover;
}

.product h2 {
    font-size: 21px;
    margin: 15px 10px 8px;
}

.price {
    color: #168a45;
    font-size: 22px;
    font-weight: bold;
    margin: 8px;
}

.product button {
    background: #168a45;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

.product button:hover {
    background: #106b35;
}

.buy {
    background: #f5a623 !important;
}

footer {
    text-align: center;
    padding: 30px;
    margin-top: 30px;
    background: #168a45;
    color: white;
}
</style>
</head>

<body>

<header>
    <h1>GH GhanaMarket</h1>
    <p>Buy and sell products in Ghana</p>
    <div class="cart">
        🛒 Cart: <span id="cartCount">0</span>
    </div>
</header>

<div class="container">

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Search for products..."
        onkeyup="searchProducts()"
    >

    <div class="products">

        <!-- Samsung -->
        <div class="product">
            <img
                src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80"
                alt="Samsung Galaxy Phone"
            >

            <h2>Samsung Galaxy Phone</h2>
            <p class="price">GH₵3,500</p>

            <button onclick="viewProduct('Samsung Galaxy Phone', 'GH₵3,500')">
                View Product
            </button>

            <button class="buy" onclick="addToCart()">
                Add to Cart
            </button>
        </div>


        <!-- Nike -->
        <div class="product">
            <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
                alt="Nike Sneakers"
            >

            <h2>Nike Sneakers</h2>
            <p class="price">GH₵850</p>

            <button onclick="viewProduct('Nike Sneakers', 'GH₵850')">
                View Product
            </button>

            <button class="buy" onclick="addToCart()">
                Add to Cart
            </button>
        </div>


        <!-- HP Laptop -->
        <div class="product">
            <img
                src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=800&q=80"
                alt="HP Laptop"
            >

            <h2>HP Laptop</h2>
            <p class="price">GH₵5,200</p>

            <button onclick="viewProduct('HP Laptop', 'GH₵5,200')">
                View Product
            </button>

            <button class="buy" onclick="addToCart()">
                Add to Cart
            </button>
        </div>


        <!-- Headphones -->
        <div class="product">
            <img
                src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
                alt="Headphones"
